services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: fincredit
      POSTGRES_USER: fincredit
      POSTGRES_PASSWORD: fincredit-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincredit -d fincredit"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fincredit-vectors:/var/lib/postgresql/data
    restart: unless-stopped

  fincredit-copilot:
    build: .
    ports:
      - "8000:8000"
    environment:
      FINCREDIT_VECTOR_STORE_BACKEND: pgvector
      FINCREDIT_PGVECTOR_CONNECTION: postgresql+psycopg://fincredit:fincredit-local-only@pgvector:5432/fincredit
      FINCREDIT_PGVECTOR_COLLECTION: fincredit_policy_chunks
      FINCREDIT_EMBEDDING_PROVIDER: hash-local
      FINCREDIT_EMBEDDING_DIMENSIONS: 256
    depends_on:
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - fincredit-data:/data
    restart: unless-stopped

volumes:
  fincredit-data:
  fincredit-vectors:
